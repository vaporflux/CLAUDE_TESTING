<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Training Survey - Client Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <div class="manager-container">
    <header class="manager-header">
      <h1>AI Training Survey Manager</h1>
      <p class="subtitle">Manage training clients, generate QR codes, and view dashboards</p>
    </header>

    <!-- Add New Client -->
    <div class="add-client-section">
      <h2>Add New Client</h2>
      <form id="addClientForm" class="client-form">
        <div class="form-row">
          <div class="form-group">
            <label for="clientName">Bank / Organization Name *</label>
            <input type="text" id="clientName" placeholder="e.g., First Community Bank" required>
          </div>
          <div class="form-group">
            <label for="contactName">Contact Person</label>
            <input type="text" id="contactName" placeholder="e.g., Jane Smith">
          </div>
          <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" placeholder="e.g., Austin, TX">
          </div>
        </div>
        <div class="form-row form-row-logo">
          <div class="form-group">
            <label for="logoFile">Bank Logo</label>
            <div class="logo-upload-row">
              <label class="logo-upload-btn btn btn-outline" for="logoFile">Choose File</label>
              <input type="file" id="logoFile" accept="image/png,image/jpeg,image/svg+xml,image/webp" hidden>
              <span class="logo-filename" id="logoFilename">No file chosen</span>
              <img id="logoPreview" class="logo-preview" style="display:none;" alt="Logo preview">
            </div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Create Client</button>
      </form>
    </div>

    <!-- Client List -->
    <div class="client-list-section">
      <h2>Your Clients</h2>
      <div id="clientList" class="client-list">
        <p class="no-data">Loading clients...</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('addClientForm');
      const clientList = document.getElementById('clientList');

      // Logo file upload preview
      const logoFileInput = document.getElementById('logoFile');
      const logoPreview = document.getElementById('logoPreview');
      const logoFilename = document.getElementById('logoFilename');
      let logoBase64 = '';

      logoFileInput.addEventListener('change', () => {
        const file = logoFileInput.files[0];
        if (!file) {
          logoBase64 = '';
          logoPreview.style.display = 'none';
          logoFilename.textContent = 'No file chosen';
          return;
        }
        if (file.size > 2 * 1024 * 1024) {
          alert('Logo file must be under 2MB.');
          logoFileInput.value = '';
          return;
        }
        logoFilename.textContent = file.name;
        const reader = new FileReader();
        reader.onload = (e) => {
          logoBase64 = e.target.result;
          logoPreview.src = logoBase64;
          logoPreview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      });

      async function loadClients() {
        try {
          const res = await fetch('/api/clients');
          const data = await res.json();

          if (!res.ok) {
            clientList.innerHTML = '<p class="no-data">Server error: ' + escapeHtml(data.error || 'Unknown error') + '</p>';
            return;
          }

          const clients = data;

          if (clients.length === 0) {
            clientList.innerHTML = '<p class="no-data">No clients yet. Add your first client above to get started.</p>';
            return;
          }

          clientList.innerHTML = clients.map(c => `
            <div class="client-card">
              ${c.logoUrl ? `<img src="${escapeHtml(c.logoUrl)}" alt="${escapeHtml(c.name)} logo" class="client-logo">` : ''}
              <div class="client-info">
                <h3>${escapeHtml(c.name)}</h3>
                <div class="client-meta">
                  ${c.contactName ? `<span>Contact: ${escapeHtml(c.contactName)}</span>` : ''}
                  ${c.location ? `<span>Location: ${escapeHtml(c.location)}</span>` : ''}
                  <span>Created: ${new Date(c.createdAt).toLocaleDateString()}</span>
                </div>
              </div>
              <div class="client-stats-mini">
                <span class="response-badge">${c.responseCount} response${c.responseCount !== 1 ? 's' : ''}</span>
              </div>
              <div class="client-actions">
                <a href="qr.html?client=${c.id}" class="btn btn-primary btn-sm">QR Code</a>
                <a href="dashboard.html?client=${c.id}" class="btn btn-secondary btn-sm">Dashboard</a>
                <a href="survey.html?client=${c.id}" class="btn btn-outline btn-sm">Preview Survey</a>
                <button class="btn btn-danger btn-sm" onclick="deleteClient('${c.id}', '${escapeHtml(c.name)}')">Delete</button>
              </div>
            </div>
          `).join('');
        } catch {
          clientList.innerHTML = '<p class="no-data">Error loading clients. Is the server running?</p>';
        }
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const data = {
          name: document.getElementById('clientName').value.trim(),
          contactName: document.getElementById('contactName').value.trim(),
          location: document.getElementById('location').value.trim(),
          logoData: logoBase64 || ''
        };

        try {
          const res = await fetch('/api/clients', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });

          if (res.ok) {
            form.reset();
            logoBase64 = '';
            logoPreview.style.display = 'none';
            logoFilename.textContent = 'No file chosen';
            loadClients();
          } else {
            const err = await res.json();
            alert('Error creating client: ' + (err.error || 'Unknown error'));
          }
        } catch (e) {
          alert('Error creating client: ' + e.message);
        }
      });

      window.deleteClient = async (id, name) => {
        if (!confirm(`Delete "${name}" and all their survey responses? This cannot be undone.`)) return;
        try {
          await fetch(`/api/clients/${id}`, { method: 'DELETE' });
          loadClients();
        } catch {
          alert('Error deleting client.');
        }
      };

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      loadClients();
    });
  </script>
</body>
</html>
